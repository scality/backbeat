---
# Throwaway workflow (BB-833): measures shutdown behaviour of two trees under
# the real CI environment, across four termination states, N runs each.
# Not part of normal CI.
name: shutdown-census

# workflow_dispatch only works from the default branch, so this runs on push
# to the census branch instead; bump JOBS_PER_CELL and push to launch a round.
on:
  push:
    branches:
    - poc/BB-833-shutdown-census

env:
  JOBS_PER_CELL: '6'
  ITERATIONS_PER_JOB: '6'

jobs:
  build:
    name: build ci-kafka
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}

    - name: Build and push ci-kafka
      uses: docker/build-push-action@v6
      with:
        push: true
        context: .github/dockerfiles/kafka
        tags: ghcr.io/${{ github.repository }}/ci-kafka:${{ github.sha }}
        cache-from: type=gha,scope=ci-kafka
        cache-to: type=gha,mode=max,scope=ci-kafka

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Build arm x scenario x job matrix
      id: gen
      run: |
        python3 - "$JOBS_PER_CELL" >> "$GITHUB_OUTPUT" <<'PY'
        import json
        import sys

        n = int(sys.argv[1])
        # sha: tree whose lib/ is under test. The harness itself is taken from
        # the census branch in every job, so both arms are measured by
        # identical code and only lib/ differs.
        arms = [
            {'arm': 'prefix', 'sha': 'fa04a32a'},
            {'arm': 'fixed', 'sha': '7c660cd0'},
        ]
        scenarios = ['idle', 'rejoining', 'draining', 'backlog']
        include = [
            dict(a, scenario=s, idx=i)
            for a in arms for s in scenarios for i in range(1, n + 1)
        ]
        print('matrix=' + json.dumps(include))
        PY

  census:
    needs: [build, prepare]
    name: ${{ matrix.arm }} ${{ matrix.scenario }} ${{ matrix.idx }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    services:
      zookeeper:
        image: zookeeper:3.9.4
        ports:
        - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
      kafka:
        image: ghcr.io/${{ github.repository }}/ci-kafka:${{ github.sha }}
        credentials:
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
        ports:
        - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # the measurement code must not vary between arms, or the A/B is
    # comparing two different harnesses rather than two trees
    - name: Stash the harness
      run: cp -r .github/harness /tmp/harness

    - name: Check out arm tree ${{ matrix.sha }}
      run: git checkout --detach ${{ matrix.sha }}

    - name: Restore the harness
      run: |
        rm -rf .github/harness
        cp -r /tmp/harness .github/harness

    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: yarn

    - name: Install node dependencies
      run: yarn install --ignore-engines --frozen-lockfile --network-concurrency 1

    - name: Report effective versions
      run: |
        node -e "console.log('node-rdkafka', require('node-rdkafka/package.json').version,
                             '/ librdkafka', require('node-rdkafka').librdkafkaVersion)"
        echo "arm tree: $(git rev-parse --short HEAD)"
        echo "close() shape:"
        grep -c '_shuttingDown' lib/BackbeatConsumer.js || echo '  0 (pre-fix)'

    - name: Wait for services
      run: |
        timeout 60 bash -c 'until nc -z localhost 9092; do sleep 1; done'
        timeout 60 bash -c 'until nc -z localhost 2181; do sleep 1; done'

    # shell: bash gives -o pipefail, without which tee masks a failure
    - name: Run shutdown census
      shell: bash
      env:
        ARM: ${{ matrix.arm }}
        SCENARIO: ${{ matrix.scenario }}
        JOB_INDEX: ${{ matrix.idx }}
        ITERATIONS: ${{ env.ITERATIONS_PER_JOB }}
        HOSTS: localhost:9092
      run: node .github/harness/shutdown-census.js 2>&1 | tee census.log

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: log-${{ matrix.arm }}-${{ matrix.scenario }}-${{ matrix.idx }}
        path: census.log
        retention-days: 7

    - name: Upload pod logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pods-${{ matrix.arm }}-${{ matrix.scenario }}-${{ matrix.idx }}
        path: census-pod-logs
        retention-days: 7
        if-no-files-found: ignore

  summary:
    needs: census
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Collect logs
      uses: actions/download-artifact@v4
      with:
        pattern: log-*
        path: logs

    - name: Tabulate
      run: |
        python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import collections
        import json
        import pathlib
        import statistics

        rows = []
        for log in sorted(pathlib.Path('logs').glob('log-*/census.log')):
            for line in log.read_text(errors='replace').splitlines():
                if line.startswith('RESULT '):
                    try:
                        rows.append(json.loads(line[len('RESULT '):]))
                    except json.JSONDecodeError:
                        pass

        cells = collections.defaultdict(list)
        for r in rows:
            cells[(r.get('arm'), r.get('scenario'))].append(r)

        def pct(part, whole):
            return '-' if not whole else '%d%%' % round(100.0 * part / whole)

        def med(values):
            vals = [v for v in values if isinstance(v, (int, float))]
            return '-' if not vals else '%d' % statistics.median(vals)

        print('## BB-833 shutdown census\n')
        print('%d iterations across %d cells\n' % (len(rows), len(cells)))
        print('| arm | scenario | n | close returned | med closeMs | '
              'exits on its own | SIGKILLed | took over | med takeoverMs | '
              '**lost msgs** | dup msgs | ERR__STATE | skipped |')
        print('|---|---|---|---|---|---|---|---|---|---|---|---|---|')
        for (arm, scenario) in sorted(cells):
            rs = cells[(arm, scenario)]
            valid = [r for r in rs if not r.get('skipped')
                     and not r.get('error') and not r.get('fatal')]
            n = len(valid)
            lost = sum(r.get('lost', 0) or 0 for r in valid)
            dup = sum(r.get('duplicated', 0) or 0 for r in valid)
            print('| %s | %s | %d | %s | %s | %s | %s | %s | %s | %s | %d | %s | %d |' % (
                arm, scenario, n,
                pct(sum(1 for r in valid if r.get('closeReturned')), n),
                med([r.get('closeMs') for r in valid]),
                pct(sum(1 for r in valid if r.get('exitedNaturally')), n),
                pct(sum(1 for r in valid if r.get('sigkilled')), n),
                pct(sum(1 for r in valid if r.get('tookOver')), n),
                med([r.get('takeoverMs') for r in valid]),
                ('**%d**' % lost) if lost else '0',
                dup,
                pct(sum(1 for r in valid if r.get('erroneousState')), n),
                len(rs) - n,
            ))

        bad = [r for r in rows if (r.get('lost') or 0) > 0]
        if bad:
            print('\n### Message loss (blocks the merge)\n')
            for r in bad[:20]:
                print('- `%s/%s` job %s iter %s: lost %d, sample %s' % (
                    r.get('arm'), r.get('scenario'), r.get('job'),
                    r.get('iteration'), r['lost'], r.get('lostSample')))

        odd = [r for r in rows if r.get('uncaught') or r.get('fatal')
               or r.get('closeAnsweredTwice')]
        if odd:
            print('\n### Anomalies\n')
            for r in odd[:20]:
                print('- `%s/%s`: uncaught=%s fatal=%s doubleAnswer=%s' % (
                    r.get('arm'), r.get('scenario'), r.get('uncaught'),
                    r.get('fatal'), r.get('closeAnsweredTwice')))

        skipped = collections.Counter(
            r['skipped'] for r in rows if r.get('skipped'))
        if skipped:
            print('\n### Skipped (state never reached)\n')
            for reason, count in skipped.most_common():
                print('- %s: %d' % (reason, count))
        PY
