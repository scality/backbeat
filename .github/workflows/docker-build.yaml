---
name: docker-build

on:
  push:
    branches-ignore:
    - development/**
    - q/*/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildk
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push federation image
        uses: docker/build-push-action@v6
        with:
          context: images/federation
          push: true
          build-args:
            BACKBEAT_VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-federation
          cache-from: type=gha,scope=federation
          cache-to: type=gha,scope=federation,mode=max

      - name: Push Assets
        uses: ./.github/actions/push-assets
        with:
          tag: ${{ github.sha }}
