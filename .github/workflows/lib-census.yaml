---
# Throwaway workflow (BB-849): measures the lib-suite flakiness rate of several
# trees under the real CI environment, N runs each. Not part of normal CI.
name: lib-census

# workflow_dispatch only works from the default branch, so this runs on push
# to the census branch instead; bump RUNS_PER_ARM and push to launch a round.
on:
  push:
    branches:
    - poc/BB-849-lib-census

env:
  RUNS_PER_ARM: '25'

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ci-kafka
            context: .github/dockerfiles/kafka
            file: ""
          - name: syntheticbucketd
            context: .
            file: .github/dockerfiles/syntheticbucketd/Dockerfile
          - name: ci-mongodb
            context: .github/dockerfiles/mongodb
            file: ""
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ github.token }}

    - name: Build and push ${{ matrix.name }}
      uses: docker/build-push-action@v6
      with:
        push: true
        context: ${{ matrix.context }}
        file: ${{ matrix.file || format('{0}/Dockerfile', matrix.context) }}
        tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
        cache-from: type=gha,scope=${{ matrix.name }}
        cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
    - name: Build arm x run matrix
      id: gen
      run: |
        python3 - "$RUNS_PER_ARM" >> "$GITHUB_OUTPUT" <<'PY'
        import json
        import sys

        n = int(sys.argv[1])
        # sha: tree to test.  nrk: node-rdkafka version to force after install
        # ('' keeps whatever the tree's yarn.lock pins).
        arms = [
            {'arm': 'E-skip-3.0.1', 'sha': 'c30d5302', 'nrk': ''},
        ]
        include = [dict(a, idx=i) for a in arms for i in range(1, n + 1)]
        print('matrix=' + json.dumps(include))
        PY

  census:
    needs: [build, prepare]
    name: ${{ matrix.arm }} ${{ matrix.idx }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    services:
      redis:
        image: redis:alpine
        ports:
        - 6379:6379
      syntheticbucketd:
        image: ghcr.io/${{ github.repository }}/syntheticbucketd:${{ github.sha }}
        ports:
        - 9001:9001
      zookeeper:
        image: zookeeper:3.9.4
        ports:
        - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
      kafka:
        image: ghcr.io/${{ github.repository }}/ci-kafka:${{ github.sha }}
        credentials:
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
        ports:
        - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      mongo:
        image: ghcr.io/${{ github.repository}}/ci-mongodb:${{ github.sha }}
        ports:
        - 27017:27017
        - 27018:27018
        - 27019:27019
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check out arm tree ${{ matrix.sha }}
      run: git checkout --detach ${{ matrix.sha }}

    - uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: yarn

    - name: Install node dependencies
      run: yarn install --ignore-engines --frozen-lockfile --network-concurrency 1

    - name: Force node-rdkafka ${{ matrix.nrk }}
      if: matrix.nrk != ''
      run: yarn add node-rdkafka@${{ matrix.nrk }} --ignore-engines --network-concurrency 1

    - name: Report effective versions
      run: |
        node -e "console.log('node-rdkafka', require('node-rdkafka/package.json').version,
                             '/ librdkafka', require('node-rdkafka').librdkafkaVersion)"
        echo "tree: $(git rev-parse --short HEAD)"
        find tests/functional/lib -name '*.js' | sort

    - name: Wait for services
      run: |
        timeout 60 bash -c 'until nc -z localhost 9092; do sleep 1; done'
        timeout 60 bash -c 'until nc -z localhost 2181; do sleep 1; done'
        timeout 60 bash -c 'until nc -z localhost 6379; do sleep 1; done'
        timeout 60 bash -c 'until nc -z localhost 27017; do sleep 1; done'

    # shell: bash gives -o pipefail, without which tee masks a mocha failure
    - name: Run lib tests
      shell: bash
      env:
        BACKBEAT_CONFIG_FILE: tests/config.json
      run: .github/scripts/run_ft_tests.bash ft_test:lib 2>&1 | tee census.log

    - name: Upload log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: log-${{ matrix.arm }}-${{ matrix.idx }}
        path: census.log
        retention-days: 7

  summary:
    needs: census
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Collect logs
      uses: actions/download-artifact@v4
      with:
        pattern: log-*
        path: logs

    - name: Tabulate per-arm outcomes
      run: |
        python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import collections
        import pathlib
        import re

        per = collections.defaultdict(lambda: collections.Counter())
        detail = collections.defaultdict(collections.Counter)
        for log in sorted(pathlib.Path('logs').glob('log-*/census.log')):
            arm = log.parent.name.split('-', 1)[1].rsplit('-', 1)[0]
            text = log.read_text(errors='replace')
            passing = re.search(r'(\d+) passing', text)
            failing = re.search(r'(\d+) failing', text)
            if not passing or int(passing.group(1)) < 10:
                per[arm]['invalid'] += 1
                continue
            per[arm]['valid'] += 1
            if failing:
                per[arm]['failed'] += 1
                for m in re.finditer(r'^\s+\d+\) (.+)$', text, re.M):
                    detail[arm][m.group(1).strip()] += 1

        print('| arm | failed / valid | rate | invalid |')
        print('|---|---|---|---|')
        for arm in sorted(per):
            c = per[arm]
            rate = 100 * c['failed'] / c['valid'] if c['valid'] else 0
            print(f"| {arm} | {c['failed']} / {c['valid']} | {rate:.0f}% | {c['invalid']} |")
        for arm in sorted(detail):
            print(f"\n**{arm}** failing contexts")
            for name, n in detail[arm].most_common():
                print(f"- {n}x {name}")
        PY
