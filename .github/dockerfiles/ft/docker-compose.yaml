services:
  sproxyd:
    profiles: ['s3c']
    build:
      context: ../sproxyd
    user: 0:0
    entrypoint: /usr/bin/sproxyd
    command: -dlw -Vinfo -c /conf/sproxyd.conf -P /run/sproxyd-0 --no-sysfs
  metadata:
    profiles: ['s3c']
    image: ${METADATA_IMAGE}
    depends_on:
      - sproxyd
    ports:
      - 9000:9000
    environment:
      SPROXYD: sproxyd:8181
    volumes:
        - ./metadata-config.json:/mnt/standalone_workdir/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9000 || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 10s
  cloudserver:
    profiles: ['s3c']
    build:
      context: ../cloudserver
      args:
        CLOUDSERVER_IMAGE: "${CLOUDSERVER_IMAGE}"
    depends_on:
      - metadata
    ports:
      - 8000:8000
    environment:
      S3DATA: file
      S3METADATA: scality
      S3VAULT: mem
      S3_CONFIG_FILE: /conf/config.json
      REMOTE_MANAGEMENT_DISABLE: 1
    command: yarn start
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:8000 || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 10s
  redis:
    profiles: ['s3c']
    image: ${REDIS_IMAGE}
    ports:
      - 6379:6379
  zookeeper:
    profiles: ['s3c']
    image: zookeeper:3.9.4
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka:
    profiles: ['s3c']
    image: ${KAFKA_IMAGE}
    depends_on:
      - zookeeper
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
