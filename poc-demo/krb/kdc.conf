[kdcdefaults]
    # container-internal port. The host-facing port is the published one,
    # KRB_KDC_PORT in demo/.env, and krb5.conf.host carries it for host
    # processes.
    kdc_ports = 1088
    kdc_tcp_ports = 1088

[realms]
    SCALITY.TEST = {
        key_stash_file = /etc/krb5kdc/stash
        # single enctype so the keytabs the KDC writes always match the keys
        # it derives from the fixed test passwords
        supported_enctypes = aes256-cts-hmac-sha1-96:normal
    }
