# Container-internal krb5.conf, used by the KDC and the broker. Both share
# the krb-net network namespace, so the KDC really is on 127.0.0.1:1088 for
# them. Host processes use krb5.conf.host instead, which stack-up.sh
# renders with the published port.
[libdefaults]
    default_realm = SCALITY.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    dns_canonicalize_hostname = false
    rdns = false
    udp_preference_limit = 1

[realms]
    SCALITY.TEST = {
        kdc = 127.0.0.1:1088
    }

[domain_realm]
    localhost = SCALITY.TEST
    .localhost = SCALITY.TEST
