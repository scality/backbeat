schema_version: "1.1"
name: whats-next-anurag
expected_outcome: |
  Anurag gets the next-action flow, read at the time of the run: the two doc links, a context
  table of at most 12 lines, and the actions that next_actions.py ranks for anurag4DSB. Reviews
  that unblock Taylor come first, then Anurag's unfinished work, then pins and Jira fixes, then
  the ready task in his repositories that unblocks the most. Tasks and PRs carry their plain
  names. The full state goes into the Tickets tab and the journal doc. It cannot ask in a test
  run, so it stops after the table.
  The writes allowed without a question are the renders of the Tickets tab, the charts and the journal doc, and the In Review auto-fix; nothing else is written. The examples in the graders come from the state on 2026-10-22.
