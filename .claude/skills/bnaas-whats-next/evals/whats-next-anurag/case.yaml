schema_version: "1.1"
name: whats-next-anurag
expected_outcome: |
  Anurag gets a short report from the Tickets tab, Jira and GitHub, read at the time of the run.
  It starts with the PRs waiting for Anurag's review, as prs.py gives them for anurag4DSB. Then the
  work Anurag can pick up: Anurag's open PRs and who they wait on, Anurag's open rows, and the next
  rows with no owner, each with "dependencies unknown" while the tab has no Depends on column.
  Then what Taylor is working on. Then the rows whose PR or Status cell disagrees with GitHub.
  It writes nothing. The examples in the graders come from the state on 2026-10-22.
