schema_version: "1.1"
name: draft-claude-comments
expected_outcome: |
  On a draft whose Claude Code review asks for action, the shepherd plans the review loop: it
  addresses the one open Claude Code thread (fix and fold, or reply, then resolve), leaves the
  human thread and the author's own thread unresolved, handles the failed lint check, waits for
  the pending tests, and says the draft is not yet ready for its author. It is read-only: it
  pushes nothing, edits no PR, resolves no thread and marks nothing ready.
tags: [skill-creator, read-only]
max_turns: 30
timeout_seconds: 900
allowed_tools: [Read, Glob, Grep, Skill, Bash, ToolSearch]
