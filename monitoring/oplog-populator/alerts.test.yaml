evaluation_interval: 30s
rule_files:
  - alerts.rendered.yaml

tests:

  - name: Oplog Populator Single Failed Scrape
    interval: 1m
    input_series:
      - series: up{namespace="zenko",job="artesca-data-backbeat-oplog-populator-headless",pod="oplog-populator-1"}
        values: 1 1 0 1 1 1
    alert_rule_test:
      - alertname: OplogPopulatorUnavailable
        eval_time: 2m30s
        exp_alerts: []
      - alertname: OplogPopulatorUnavailable
        eval_time: 4m
        exp_alerts: []

  - name: Oplog Populator Replicas
    interval: 1m
    input_series:
      - series: up{namespace="zenko",job="artesca-data-backbeat-oplog-populator-headless",pod="oplog-populator-1"}
        values: 1 1 0 0 0 0
    alert_rule_test:
      - alertname: OplogPopulatorUnavailable
        eval_time: 1m
        exp_alerts: []
      - alertname: OplogPopulatorUnavailable
        eval_time: 3m
        exp_alerts: []
      - alertname: OplogPopulatorUnavailable
        eval_time: 4m30s
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Oplog populator pod is down"
              summary: "Oplog populator service is in critical state"

  - name: Connector Configuration Failure
    interval: 1m
    input_series:
      - series: s3_oplog_populator_connector_configuration_applied_total{connector="example-connector",success="false",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0+0x4 0+40x4 160+50x6
      - series: s3_oplog_populator_connector_configuration_applied_total{connector="example-connector",success="true",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 100+100x16
    alert_rule_test:
      - alertname: KafkaConnectFailedConnectorConfiguration
        eval_time: 5m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectorConfiguration
        eval_time: 10m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectorConfiguration
        eval_time: 16m
        exp_alerts:
          - exp_labels:
              severity: critical
              connector: example-connector
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Oplog populator failed to configure connector"
              summary: "Oplog populator couldn't update kafka connect connector"

  - name: Connector Failures
    interval: 1m
    input_series:
      - series: s3_oplog_populator_connector_restarts{connector="example-connector",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0+0x9 0+10x9 90+20x11
    alert_rule_test:
      - alertname: KafkaConnectFailedConnectors
        eval_time: 10m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectors
        eval_time: 20m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectors
        eval_time: 31m
        exp_alerts:
          - exp_labels:
              severity: critical
              connector: example-connector
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Oplog populator restarted connectors too many times"
              summary: "Oplog populator connectors keep failing after restarts"

  - name: Number of Kafka Connect Replicas
    interval: 1m
    input_series:
      - series: s3_oplog_populator_expected_connectors{job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0x26
      - series: s3_oplog_populator_connectors{state="running",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 1x3 11x20 1x3
    alert_rule_test:
      - alertname: KafkaConnectTooManyConnectors
        eval_time: 4m
        exp_alerts: []
      - alertname: KafkaConnectTooManyConnectors
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Kafka connector count is above the number of hashed connectors, or above the soft limit with per-bucket ingestion. With per-bucket ingestion, if the number of buckets is too high, consider using a single replica for your cluster"
              summary: "Kafka connector count is above the soft limit"
      - alertname: KafkaConnectReplicasAbove
        eval_time: 25m
        exp_alerts: []

  - name: Per-bucket Connectors Below The Limit
    interval: 1m
    input_series:
      - series: s3_oplog_populator_expected_connectors{job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0x15
      - series: s3_oplog_populator_connectors{state="running",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 3x15
    alert_rule_test:
      - alertname: KafkaConnectTooManyConnectors
        eval_time: 10m
        exp_alerts: []

  - name: Number of Hashed Connectors
    interval: 1m
    input_series:
      - series: s3_oplog_populator_expected_connectors{job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 12x40
      - series: s3_oplog_populator_connectors{state="running",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 11x20 13x20
      - series: s3_oplog_populator_connectors{state="paused",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 1x40
      - series: s3_oplog_populator_connectors{state="outdated",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 30x40
    alert_rule_test:
      - alertname: KafkaConnectTooManyConnectors
        eval_time: 15m
        exp_alerts: []
      - alertname: KafkaConnectTooManyConnectors
        eval_time: 35m
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Kafka connector count is above the number of hashed connectors, or above the soft limit with per-bucket ingestion. With per-bucket ingestion, if the number of buckets is too high, consider using a single replica for your cluster"
              summary: "Kafka connector count is above the soft limit"

  - name: Connector Paused
    interval: 1m
    input_series:
      - series: s3_oplog_populator_connectors{state="paused",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0x5 1x20
    alert_rule_test:
      - alertname: OplogPopulatorConnectorPaused
        eval_time: 10m
        exp_alerts: []
      - alertname: OplogPopulatorConnectorPaused
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "An oplog populator connector is paused or stopped, so changes to the buckets it covers are not processed: replication, lifecycle and notifications are delayed for these buckets"
              summary: "Oplog populator connector paused"

  - name: Migration Not Completing
    interval: 1m
    input_series:
      - series: s3_oplog_populator_connectors{state="outdated",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 3x5 0x5 3x40
    alert_rule_test:
      - alertname: OplogPopulatorMigrationNotCompleting
        eval_time: 10m
        exp_alerts: []
      - alertname: OplogPopulatorMigrationNotCompleting
        eval_time: 45m
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "The oplog populator has not completed the migration of its connectors for 30 minutes, so changes to some buckets may be delayed"
              summary: "Oplog populator migration not completing"
