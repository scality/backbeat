evaluation_interval: 1m
rule_files:
  - alerts.rendered.yaml

tests:

  - name: Oplog Populator Replicas
    interval: 1m
    input_series:
      - series: up{namespace="zenko",job="artesca-data-backbeat-oplog-populator-headless",pod="oplog-populator-1"}
        values: 1 1 0
    alert_rule_test:
      - alertname: OplogPopulatorUnavailable
        eval_time: 1m
        exp_alerts: []
      - alertname: OplogPopulatorUnavailable
        eval_time: 2m
        exp_alerts: []
      - alertname: OplogPopulatorUnavailable
        eval_time: 3m
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Oplog populator pod is down"
              summary: "Oplog populator service is in critical state"

  - name: Connector Configuration Failure
    interval: 1m
    input_series:
      - series: s3_oplog_populator_reconfiguration{connector="example-connector",success="false",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0+0x4 0+40x4 160+50x6
      - series: s3_oplog_populator_reconfiguration{connector="example-connector",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 100+100x16
    alert_rule_test:
      - alertname: KafkaConnectFailedConnectorConfiguration
        eval_time: 5m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectorConfiguration
        eval_time: 10m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectorConfiguration
        eval_time: 16m
        exp_alerts:
          - exp_labels:
              severity: critical
              connector: example-connector
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Oplog populator failed to configure connector"
              summary: "Oplog populator couldn't update kafka connect connector"

  - name: Connector Failures
    interval: 1m
    input_series:
      - series: s3_oplog_populator_connector_restarts{connector="example-connector",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0+0x9 0+10x9 90+20x11
    alert_rule_test:
      - alertname: KafkaConnectFailedConnectors
        eval_time: 10m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectors
        eval_time: 20m
        exp_alerts: []
      - alertname: KafkaConnectFailedConnectors
        eval_time: 31m
        exp_alerts:
          - exp_labels:
              severity: critical
              connector: example-connector
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Oplog populator restarted connectors too many times"
              summary: "Oplog populator connectors keep failing after restarts"

  - name: Number of Kafka Connect Replicas
    interval: 1m
    input_series:
      - series: s3_oplog_populator_connectors{job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 1x3 11x20 1x3
    alert_rule_test:
      - alertname: KafkaConnectTooManyConnectors
        eval_time: 4m
        exp_alerts: []
      - alertname: KafkaConnectTooManyConnectors
        eval_time: 15m
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Kafka connector count is above the soft limit. If the number of buckets is too high, consider using a single replica for your cluster"
              summary: "Kafka connector count is above the soft limit"
      - alertname: KafkaConnectReplicasAbove
        eval_time: 25m
        exp_alerts: []

  - name: Newer Generation Connectors
    interval: 1m
    input_series:
      - series: s3_oplog_populator_newer_generation_connectors{job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0x5 1x20
    alert_rule_test:
      - alertname: OplogPopulatorNewerGenerationConnectors
        eval_time: 10m
        exp_alerts: []
      - alertname: OplogPopulatorNewerGenerationConnectors
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Kafka connect holds connectors created by a newer oplog populator, which this one does not manage: failed connectors are not restarted"
              summary: "Oplog populator found connectors of a newer version"

  - name: Connector Paused Or Edited
    interval: 1m
    input_series:
      - series: s3_oplog_populator_hashed_connectors{state="paused",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0x5 1x20
      - series: s3_oplog_populator_hashed_connectors{state="edited",job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 0x25
    alert_rule_test:
      - alertname: OplogPopulatorConnectorPaused
        eval_time: 10m
        exp_alerts: []
      - alertname: OplogPopulatorConnectorPaused
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "A hashed oplog populator connector is paused, so the buckets it covers are not ingested. Resume it through the kafka connect API"
              summary: "Oplog populator connector paused"
      - alertname: OplogPopulatorConnectorEdited
        eval_time: 20m
        exp_alerts: []

  - name: Migration Not Completing
    interval: 1m
    input_series:
      - series: s3_oplog_populator_outdated_connectors{job="artesca-data-backbeat-oplog-populator-headless",namespace="zenko"}
        values: 3x5 0x5 3x40
    alert_rule_test:
      - alertname: OplogPopulatorMigrationNotCompleting
        eval_time: 10m
        exp_alerts: []
      - alertname: OplogPopulatorMigrationNotCompleting
        eval_time: 45m
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              zenko_service: backbeat-oplog-populator
              description: "Connectors are still waiting to be migrated to hashed connectors. Kafka connect may not support the offsets API (< 3.5), or the migration keeps failing"
              summary: "Oplog populator migration not completing"
